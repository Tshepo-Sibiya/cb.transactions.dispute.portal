services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    ports:
      - "1434:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password0!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -Q 'SELECT 1'" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./transactions.portal.services
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      Database__SqlServer: "Server=db,1433;Database=DisputePortal;User Id=sa;Password=Password0!;TrustServerCertificate=True;MultipleActiveResultSets=true;Connect Timeout=30;"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./transactions.portal.web
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  mssql_data:
